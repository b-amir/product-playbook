<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Product Playbook</title>
  <desc id="desc">Agent Skill that turns automated tests and source into tester-facing playbook scenarios.</desc>

  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="520" height="360" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#faf8f5"/>
  <rect x="1.5" y="1.5" width="1197" height="457" rx="22.5" fill="none" stroke="#d6d3d1" stroke-width="1.5"/>

  <!-- Left -->
  <g transform="translate(56 72)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.14em" fill="#78716c">AGENT SKILL</text>
    <text y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#1c1917">Product Playbook</text>
    <text y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#44403c">Tests and source in.</text>
    <text y="134" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#44403c">Tester-ready scenarios out.</text>
    <text y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#78716c">Evidence-backed playbooks for QA,</text>
    <text y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#78716c">product, support, and ops.</text>

    <g transform="translate(0 276)">
      <rect width="120" height="46" rx="11" fill="#1c1917"/>
      <text x="60" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#faf8f5">discover</text>

      <path d="M 132 23 L 160 23" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>
      <path d="M 152 17 L 162 23 L 152 29" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="174" width="126" height="46" rx="11" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
      <text x="237" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1c1917">reconcile</text>

      <path d="M 312 23 L 340 23" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>
      <path d="M 332 17 L 342 23 L 332 29" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="354" width="120" height="46" rx="11" fill="#166534"/>
      <text x="414" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#faf8f5">playbook</text>
    </g>
  </g>

  <!-- Right playbook specimen: 50px top/bottom outer margin -->
  <g transform="translate(620 50)">
    <rect width="520" height="360" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect width="520" height="56" fill="#f5f5f4"/>
      <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#78716c">docs/playbook/</text>
      <line x1="0" y1="56" x2="520" y2="56" stroke="#e7e5e4"/>

      <!-- 24 inset, 66 tall rows, 14 gaps: 80 + 66+14 + 66+14 + 66 = 306; bottom pad = 54 -->
      <g transform="translate(24 80)">
        <rect width="472" height="66" rx="12" fill="#faf8f5" stroke="#e7e5e4"/>
        <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#166534">GI-04</text>
        <text x="78" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1c1917">Complete login with a magic link</text>
        <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#78716c">Pass: home screen opens with an active session</text>
      </g>

      <g transform="translate(24 160)">
        <rect width="472" height="66" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
        <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#166534">EU-01</text>
        <text x="78" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1c1917">Start a chat from the home screen</text>
        <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#78716c">Pass: composer ready and first reply appears</text>
      </g>

      <g transform="translate(24 240)">
        <rect width="472" height="66" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
        <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#166534">AD-04</text>
        <text x="78" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1c1917">Roles and Permissions</text>
        <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#78716c">Pass: matrix matches the saved access profile</text>
      </g>
    </g>
  </g>
</svg>
