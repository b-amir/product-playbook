<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Product Playbook</title>
  <desc id="desc">Turns product evidence into simple manual steps like sign in and select Continue, with optional Export PDF.</desc>

  <defs>
    <clipPath id="window">
      <rect x="0" y="0" width="540" height="340" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="440" rx="20" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#e2e5ea" stroke-width="2"/>

  <g transform="translate(56 78)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="0.16em" fill="#66707d">AGENT SKILL</text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#0e1014">Product Playbook</text>
    <text y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#2e333c">Evidence in.</text>
    <text y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#2e333c">Plain tester steps out.</text>
    <text y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#66707d">From tests, docs, and the live product</text>
    <text y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#66707d">to scenarios anyone on the team can run.</text>

    <g transform="translate(0 258)">
      <rect width="132" height="44" rx="8" fill="#0e1014"/>
      <text x="66" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ffffff">discover</text>
      <path d="M144 22 H170" stroke="#66707d" stroke-width="2" stroke-linecap="round"/>
      <path d="M162 16 L172 22 L162 28" fill="none" stroke="#66707d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="184" width="148" height="44" rx="8" fill="#0f766e"/>
      <text x="258" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ffffff">manual playbook</text>
    </g>
  </g>

  <g transform="translate(600 50)">
    <rect width="540" height="340" rx="14" fill="#ffffff" stroke="#e2e5ea" stroke-width="2"/>
    <g clip-path="url(#window)">
      <rect width="540" height="52" fill="#f7f8fa"/>
      <circle cx="24" cy="26" r="5" fill="#e2e5ea"/>
      <circle cx="42" cy="26" r="5" fill="#e2e5ea"/>
      <circle cx="60" cy="26" r="5" fill="#e2e5ea"/>
      <text x="88" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#66707d">01-getting-in.md</text>
      <rect x="388" y="12" width="132" height="28" rx="7" fill="#eef1f4" stroke="#d5dae0" stroke-width="1.5"/>
      <text x="454" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2e333c">Export PDF</text>
      <line x1="0" y1="52" x2="540" y2="52" stroke="#e2e5ea"/>

      <text x="28" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#66707d">AUTH-01</text>
      <text x="28" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#0e1014">Sign in with email</text>
      <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#66707d">Open the home screen with an active session.</text>

      <text x="28" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0e1014">Steps</text>
      <text x="28" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#66707d">1</text>
      <text x="52" y="224" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#2e333c">Open the sign-in page.</text>
      <text x="28" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#66707d">2</text>
      <text x="52" y="256" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#2e333c">Enter the approved test email.</text>
      <text x="28" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#66707d">3</text>
      <text x="52" y="288" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#2e333c">Select</text>
      <rect x="112" y="270" width="108" height="28" rx="6" fill="#ecfdf5"/>
      <text x="166" y="289" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0f766e">Continue</text>

      <text x="28" y="322" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#66707d">Expected: home screen opens signed in.</text>
    </g>
  </g>
</svg>
