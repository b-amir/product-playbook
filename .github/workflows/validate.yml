name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Fixture runnable tests (reference)
        run: |
          python scripts/playbook_tests.py check evals/reference/playbook-tests
          python scripts/playbook_tests.py drift evals/reference/playbook-tests \
            --source "product=evals/fixture-product"
          (cd evals/fixture-product && PORT=8765 python app.py &) && sleep 1
          python scripts/playbook_tests.py run evals/reference/playbook-tests --target local \
            --output fixture-run.md
          cat fixture-run.md >> "$GITHUB_STEP_SUMMARY"
